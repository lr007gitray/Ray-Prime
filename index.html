<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray Prime - Consultoria Imobiliária</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <!-- Cabeçalho e Perfil do Anunciante com Logo -->
    <header class="site-header">
        <div class="container header-content">
            <div class="brand-wrapper">
                <img src="imagens/logo.png" alt="Ray Prime Logo" class="brand-logo">
                <div class="brand">
                    <h1 id="nome-anunciante">Ray Prime</h1>
                    <p id="titulo-anunciante">Consultoria Imobiliária</p>
                </div>
            </div>
            <div class="contact-action" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button id="btn-abrir-cadastro" class="btn-cadastrar">+ Novo Imóvel</button>
                <a id="btn-whatsapp" href="#" target="_blank" class="btn-whatsapp" style="display: none;">Fale no WhatsApp</a>
            </div>
        </div>
    </header>

    <!-- Área de Busca e Filtros -->
    <section class="search-section">
        <div class="container search-grid">
            <input type="text" id="input-busca" placeholder="Buscar por título, cidade ou região...">
            <select id="filtro-finalidade">
                <option value="">Todas as finalidades</option>
                <option value="Venda">Venda</option>
                <option value="Aluguel">Aluguel</option>
            </select>
            <select id="filtro-tipo">
                <option value="">Todos os tipos</option>
                <option value="Casa">Casa</option>
                <option value="Apartamento">Apartamento</option>
                <option value="Terreno">Terreno</option>
                <option value="Comercial">Comercial</option>
            </select>
            <button id="btn-limpar" class="btn-secondary">Limpar Filtros</button>
        </div>
    </section>

    <!-- Listagem do Catálogo -->
    <main class="container catalog-container">
        <div class="catalog-info">
            <p id="contador-resultados">Carregando imóveis...</p>
        </div>
        <div id="grid-imoveis" class="property-grid">
            <!-- Os cards dos imóveis serão injetados via JavaScript -->
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Ray Prime - Todos os direitos reservados.</p>
            <p class="aviso-ficticio">* Catálogo Digital Profissional.</p>
        </div>
    </footer>

    <!-- Scripts separados -->
    <script src="js/configuracao.js"></script>
    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
